name: siteflow

# Development overlay: run the application services with live-reloading
# watchers instead of the production images.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# The infrastructure (postgres, redis, minio) comes from docker-compose.yml.

services:
  server:
    build:
      context: ./server
      target: development
    image: siteflow/server:dev
    command: npm run dev
    environment:
      CLIENT_URL: http://localhost:5173
      NODE_ENV: development
    volumes:
      - ./server/src:/app/src
      - ./server/tsconfig.json:/app/tsconfig.json

  client:
    build:
      context: ./client
      target: development
    image: siteflow/client:dev
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_DEV_PROXY_TARGET: http://server:4000
    ports:
      - "5173:5173"
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
      - ./client/vite.config.ts:/app/vite.config.ts
      - ./client/tsconfig.json:/app/tsconfig.json