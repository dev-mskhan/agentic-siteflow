# ──────────────────────────────────────────────────────────────────────────────
# OpenTelemetry Collector config for SigNoz (local development)
#
# Receives OTLP from the Node.js app → forwards to SigNoz ClickHouse exporter.
# Ports:
#   4317 — OTLP gRPC
#   4318 — OTLP HTTP  ← app sends here by default
# ──────────────────────────────────────────────────────────────────────────────

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch spans/metrics for efficient export
  batch:
    send_batch_size: 1000
    timeout: 10s

  # Add resource attributes automatically
  resourcedetection:
    detectors: [env, system]
    timeout: 5s

  # Memory safety — drop data if collector OOMs
  memory_limiter:
    check_interval: 5s
    limit_mib: 400
    spike_limit_mib: 100

exporters:
  # SigNoz ClickHouse exporter for traces
  clickhousetraces:
    datasource: tcp://siteflow-signoz-clickhouse:9000/signoz_traces

  # Debug logging
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [clickhousetraces, debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
