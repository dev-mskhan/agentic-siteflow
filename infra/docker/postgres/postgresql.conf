# SiteFlow PostgreSQL configuration — development + staging
# Gap G24/G25/G27: pg_stat_statements + slow query logging

listen_addresses = '*'
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all

# Log any query taking longer than 200ms
log_min_duration_statement = 200
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# WAL archiving for Point-in-Time Recovery (Task 17 / Gap G30)
# Uncomment and configure BACKUP_BUCKET when S3 is available in the deployment environment
# wal_level = replica
# archive_mode = on
# archive_command = 'aws s3 cp %p $BACKUP_BUCKET/postgres/wal/%f'
# archive_timeout = 300
