# SiteFlow Redis Configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# Key namespace summary (for eviction policy context)
# ─────────────────────────────────────────────────────────────────────────────
# project:*          API cache     TTL 5 min         volatile-lru eligible
# projects:org:*     API cache     TTL 3 min         volatile-lru eligible
# estimate:*         API cache     TTL 10 min        volatile-lru eligible
# org:*:members      API cache     TTL 10 min        volatile-lru eligible
# budget:project:*   API cache     TTL 5 min         volatile-lru eligible
# fin:*              API cache     TTL 3 min         volatile-lru eligible
# compliance:org:*   API cache     TTL 5 min         volatile-lru eligible
# cost-codes:org:*   API cache     TTL 30 min        volatile-lru eligible
# rate-cards:org:*   API cache     TTL 30 min        volatile-lru eligible
# health:project:*   API cache     TTL 5 min         volatile-lru eligible
# schedule:metrics:* API cache     TTL 5 min         volatile-lru eligible
# cost:metrics:*     API cache     TTL 3 min         volatile-lru eligible
# procurement:*      API cache     TTL 5 min         volatile-lru eligible
# sub:metrics:*      API cache     TTL 5 min         volatile-lru eligible
# report:full:*      API cache     TTL 3 min         volatile-lru eligible
# exec:dashboard:*   API cache     TTL 3 min         volatile-lru eligible
# rl:tenant:*        Rate limit    TTL = window       volatile-lru eligible
# rl:global:*        Rate limit    TTL = window       volatile-lru eligible
# jobs:active:*      BullMQ guard  TTL 1h (safety)   volatile-lru eligible
# bull:*             BullMQ        managed by BullMQ  volatile-lru eligible

# ─────────────────────────────────────────────────────────────────────────────
# Memory management
# ─────────────────────────────────────────────────────────────────────────────

# Maximum memory Redis may use before eviction kicks in.
# Set to ~75% of the RAM budget you want Redis to consume.
# 256mb is a safe default for a single-node dev/staging setup.
# For production, tune based on key count * average value size.
maxmemory 256mb

# Evict keys that have a TTL using LRU approximation when memory is full.
# volatile-lru is the correct choice here because:
#   - Every cache key has an explicit EX TTL set via cacheSet()
#   - Rate-limit counters (rl:*) carry window-length TTLs
#   - BullMQ job-concurrency keys (jobs:active:*) carry a 1h safety TTL
#   - BullMQ's own internal keys (bull:*) have TTLs managed by BullMQ itself
# Under memory pressure, stale/cold cache entries are evicted first,
# preserving in-flight job state and rate-limit accuracy.
maxmemory-policy volatile-lru

# ─────────────────────────────────────────────────────────────────────────────
# Persistence
# ─────────────────────────────────────────────────────────────────────────────

# Snapshot (RDB): persist to disk every 60 seconds if at least 1 key changed.
# Provides a best-effort recovery point on container restart. Fast and
# sufficient for a cache workload where stale data is acceptable on restart.
save 60 1

# Append-only log (AOF) is disabled by default for a pure-cache workload.
# Enable if stronger durability is needed (e.g. rate-limit accuracy must
# survive a Redis restart without a brief burst allowance window).
# appendonly yes
# appendfsync everysec

# ─────────────────────────────────────────────────────────────────────────────
# Networking
# ─────────────────────────────────────────────────────────────────────────────

# Bind to all interfaces inside the container (docker-compose handles
# external access restriction via the exposed ports mapping).
bind 0.0.0.0

# ─────────────────────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────────────────────

# notice: production-appropriate log level.
# Use verbose or debug only for active troubleshooting.
loglevel notice
